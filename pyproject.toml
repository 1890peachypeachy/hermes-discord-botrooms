[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-discord-botrooms"
version = "0.2.0"
description = "Multi-profile Hermes Bot Rooms for Discord"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "DanielOu1208" }]
dependencies = ["aiohttp>=3.9,<4", "PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["hermes_discord_botrooms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
