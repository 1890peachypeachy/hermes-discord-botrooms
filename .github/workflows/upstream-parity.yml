name: Upstream Hermes parity

on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare official coordination region
        id: parity
        shell: bash
        run: |
          set +e
          python scripts/check_upstream_parity.py --json > parity-report.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat parity-report.json
      - name: Open or update the single drift issue
        if: steps.parity.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = JSON.parse(fs.readFileSync('parity-report.json', 'utf8'))
            const title = 'Upstream Hermes Bot Mode coordination changed'
            const marker = `latest:${report.latest_commit}`
            const body = [
              'The tracked official Hermes Bot Mode coordination region changed.',
              '',
              `- Reference commit: \`${report.reference_commit}\``,
              `- Latest commit: \`${report.latest_commit}\``,
              `- Reference hash: \`${report.reference_coordination_sha256}\``,
              `- Latest hash: \`${report.latest_coordination_sha256 || 'markers missing'}\``,
              '',
              'Review and port the relevant behavior; do not update the pinned snapshot automatically.',
              `<!-- ${marker} -->`,
            ].join('\n')
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const issue = issues.find(item => !item.pull_request && item.title === title)
            if (!issue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
              return
            }
            if ((issue.body || '').includes(marker)) return
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            })
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `New upstream drift detected at \`${report.latest_commit}\`.`,
            })
      - name: Fail on drift or an operational check error
        if: steps.parity.outputs.code != '0'
        run: exit 1
