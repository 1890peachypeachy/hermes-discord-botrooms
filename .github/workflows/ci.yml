name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HERMES_COMPAT_BASE: ef46ec03e11452eab74e261147668fb64a3d9fd3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Hermes and test dependencies
        run: |
          python -m pip install --upgrade pip
          git init /tmp/hermes-agent
          git -C /tmp/hermes-agent remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C /tmp/hermes-agent fetch --depth 1 origin "$HERMES_COMPAT_BASE"
          git -C /tmp/hermes-agent checkout --detach FETCH_HEAD
          git -C /tmp/hermes-agent apply "$GITHUB_WORKSPACE/patches/hermes-machine-session-hooks.patch"
          python -m pip install -e "/tmp/hermes-agent[messaging]"
          python -m pip install -e . pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Test Hermes session-hook regressions
        run: |
          cd /tmp/hermes-agent
          python -m pytest -q tests/test_tui_gateway_server.py \
            -k "session_create or session_resume or tool_progress or reset_session_agent"
      - name: Validate plugin manifest and imports
        run: |
          python -m hermes_discord_botrooms.compat --json
          hermes plugins doctor . --ci
