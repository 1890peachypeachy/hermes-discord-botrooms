name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prepare-hermes:
    runs-on: ubuntu-latest
    env:
      HERMES_COMPAT_BASE: ef46ec03e11452eab74e261147668fb64a3d9fd3
      HERMES_COMPAT_RELEASE: ci-hermes-ef46ec03
      HERMES_COMPAT_ARCHIVE: hermes-agent-ef46ec03e11452eab74e261147668fb64a3d9fd3.tar.gz
      HERMES_COMPAT_SHA256: d2004e1f6415d85fb1339e5977f0b45f3bcfad1059a345c16d37c99f65318592
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned Hermes source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$HERMES_COMPAT_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$HERMES_COMPAT_ARCHIVE" \
            --dir /tmp
          printf '%s  %s\n' \
            "$HERMES_COMPAT_SHA256" "/tmp/$HERMES_COMPAT_ARCHIVE" \
            | sha256sum --check -
          mkdir hermes-agent
          tar -xzf "/tmp/$HERMES_COMPAT_ARCHIVE" \
            --strip-components=1 -C hermes-agent
          git -C hermes-agent init
      - name: Apply machine-session compatibility patch
        run: git -C hermes-agent apply "$GITHUB_WORKSPACE/patches/hermes-machine-session-hooks.patch"
      - name: Upload patched Hermes source
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ env.HERMES_COMPAT_BASE }}
          path: hermes-agent
          if-no-files-found: error
          retention-days: 1

  test:
    needs: prepare-hermes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HERMES_COMPAT_BASE: ef46ec03e11452eab74e261147668fb64a3d9fd3
      HERMES_DIR: /tmp/hermes-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download patched Hermes source
        uses: actions/download-artifact@v4
        with:
          name: hermes-${{ env.HERMES_COMPAT_BASE }}
          path: ${{ env.HERMES_DIR }}
      - name: Install Hermes and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${HERMES_DIR}[messaging]"
          python -m pip install -e . pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Test Hermes session-hook regressions
        run: |
          cd "$HERMES_DIR"
          python -m pytest -q tests/test_tui_gateway_server.py \
            -k "session_create or session_resume or tool_progress or reset_session_agent"
      - name: Validate plugin manifest and imports
        run: |
          python -m hermes_discord_botrooms.compat --json
          hermes plugins doctor . --ci
